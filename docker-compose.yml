services:
  wiremock:
    image: wiremock/wiremock:3.13.0
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "8081:8080"        # admin API acessível em http://localhost:8081/__admin
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings

  app:
    build: .
    environment:
      API_PEDIDOS_URL: http://wiremock:8080
    ports:
      - "8080:8080"
    depends_on:
      - wiremock

  k6:
    image: grafana/k6:0.57.0
    profiles: ["load"]     # só roda sob demanda
    volumes:
      - ./k6:/scripts
    environment:
      TARGET: http://app:8080
      RATE: "2000"          # req/s — suba conforme sua máquina aguentar
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:v3.4.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.6.1
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/resilience4j.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
